<style>
:root{--ink:#0b1020;--moon:#eef1ff;--amber:#ffb454;--blood:#ff4d5e;--mint:#5ee3b0;--g:rgba(9,13,30,.64);--gb:rgba(255,255,255,.13)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--moon);font:15px/1.4 Onest,sans-serif;user-select:none}
.d,h1,h2{font-family:Unbounded,sans-serif}
/* SKY */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.6s}
.b-dusk{background:linear-gradient(#1d1a3d,#5b2f6b 60%,#c4586a)}
.b-night{background:linear-gradient(#050816,#0e1736 65%,#1b2a5c)}
.b-day{background:linear-gradient(#2f7fd6,#7cc1ff 60%,#cfeaff)}
.b-vote{background:linear-gradient(#2a0d17,#7a1f2e 55%,#e8793a)}
#sky[data-p=dusk] .b-dusk,#sky[data-p=night] .b-night,#sky[data-p=day] .b-day,#sky[data-p=vote] .b-vote{opacity:1}
#sky[data-p=vote]::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 130px rgba(255,40,60,.4);animation:pu 2s infinite}
.orb{position:absolute;width:72px;height:72px;border-radius:50%;left:72%;top:9%;transition:all 1.9s cubic-bezier(.5,0,.2,1);background:radial-gradient(circle at 35% 35%,#fff,#dfe6ff 60%,#aab6f0);box-shadow:0 0 50px 12px rgba(190,205,255,.35)}
#sky[data-p=day] .orb{left:18%;top:7%;background:radial-gradient(circle,#fff6c9,#ffd45e 65%);box-shadow:0 0 80px 30px rgba(255,214,90,.55)}
#sky[data-p=vote] .orb{left:42%;top:42%;width:120px;height:120px;background:radial-gradient(circle,#ffd9a0,#ff7a3d 70%);box-shadow:0 0 90px 30px rgba(255,100,50,.5)}
#sky[data-p=dusk] .orb{top:26%;left:62%;background:radial-gradient(circle,#ffe7c4,#f0a1a8 70%);box-shadow:0 0 60px 16px rgba(255,170,170,.3)}
.st{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;transition:opacity 1.6s}
#sky[data-p=night] .st,#sky[data-p=dusk] .st{opacity:.9;animation:tw 3s infinite}
.cl{position:absolute;height:32px;width:130px;border-radius:40px;background:rgba(255,255,255,.8);filter:blur(6px);opacity:0;transition:opacity 1.6s;animation:drift 38s linear infinite}
#sky[data-p=day] .cl{opacity:1}
#city{position:absolute;bottom:0;left:0;width:100%;height:26vh;fill:#05070f}
.w{fill:#ffc965;opacity:0;transition:opacity 1.5s}
#sky[data-p=night] .w,#sky[data-p=dusk] .w{opacity:.9;animation:fl 6s infinite}
#sky[data-p=vote] .w{opacity:.5}
@keyframes tw{50%{opacity:.2}}@keyframes pu{50%{opacity:.4}}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
@keyframes fl{0%,90%,100%{opacity:.9}94%{opacity:.15}}
/* LAYOUT */
#app{position:relative;z-index:2;height:100%}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
.scr::-webkit-scrollbar{display:none}
.scr.on{display:flex;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.gl{background:var(--g);border:1px solid var(--gb);border-radius:20px;padding:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;text-align:center;margin:6px 0 2px}
.sub{text-align:center;opacity:.75;font-size:13px;margin-bottom:16px}
.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px;font:600 15px Onest,sans-serif;color:#1a1204;background:linear-gradient(135deg,#ffcb6b,#ff9f43);margin-bottom:10px;transition:transform .15s;box-shadow:0 6px 22px rgba(255,170,70,.25)}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.35;box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ff6b7a,#d92b45);color:#fff;box-shadow:0 6px 22px rgba(255,60,80,.28)}
.btn.gh{background:rgba(255,255,255,.12);color:var(--moon);box-shadow:none}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--gb);background:rgba(255,255,255,.08);color:var(--moon);font:500 16px Onest,sans-serif;outline:none;margin-bottom:10px;user-select:text}
.inp.code{font:800 26px Unbounded,sans-serif;text-align:center;letter-spacing:8px;text-transform:uppercase}
.lbl{font-size:12px;opacity:.65;margin:4px 2px 8px}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;text-align:center;padding:10px 4px;border-radius:14px;border:1px solid var(--gb);background:rgba(255,255,255,.06);font-size:13px;transition:all .2s}
.chip b{display:block;font-size:20px;font-weight:400}
.chip.sel{border-color:var(--amber);background:rgba(255,180,84,.16);transform:translateY(-2px)}
.room{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);margin-bottom:8px}
.room .c{font:800 18px Unbounded,sans-serif;color:var(--amber);letter-spacing:3px}
.room small{opacity:.7;flex:1}
/* LOBBY */
.code{font:800 50px Unbounded,sans-serif;letter-spacing:12px;text-align:center;color:var(--amber);text-shadow:0 0 36px rgba(255,180,84,.45);animation:glow 3s infinite}
@keyframes glow{50%{text-shadow:0 0 60px rgba(255,180,84,.8)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--gb);min-width:0}
.pc .a{font-size:24px}.pc .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pc.me{border-color:var(--amber)}.pc.dead{opacity:.45;filter:grayscale(1)}.pc.dead .n{text-decoration:line-through}
.pc small{font-size:11px;opacity:.8}
/* PHASE BAR */
.steps{display:flex;gap:6px;margin-bottom:10px}
.stp{flex:1;text-align:center;font-size:11px;padding:8px 2px;border-radius:12px;opacity:.4;transition:all .6s;border:1px solid transparent}
.stp b{display:block;font-size:20px;font-weight:400}
.stp.past{opacity:.6}
.stp.on{opacity:1;background:rgba(255,255,255,.14);border-color:var(--amber);transform:scale(1.07);box-shadow:0 0 22px rgba(255,180,84,.35)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--amber),#fff3c4);transition:width .3s linear}
.bar.low i{background:var(--blood)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;opacity:.85}
#tm{font:800 22px Unbounded,sans-serif}
.hint{font-size:17px;font-weight:600;text-align:center;margin:2px 4px 14px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
/* STAGE */
.tg{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--gb);margin-bottom:8px;position:relative;overflow:hidden;transition:all .2s}
.tg:active{transform:scale(.98)}
.tg .a{font-size:24px}.tg .n{flex:1;font-weight:500}
.tg.sel{border-color:var(--blood);background:rgba(255,77,94,.2);transform:translateX(4px)}
.tg .v{font:800 14px Unbounded,sans-serif;color:var(--amber)}
.tg .pv{position:absolute;left:0;bottom:0;height:3px;background:var(--blood);transition:width .5s}
.fresh .it{animation:rise .55s both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.big{text-align:center;padding:10px 0}.big .e{font-size:54px;display:block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.news{font-size:16px;text-align:center}.news b{color:var(--amber)}
#chat{display:none}#chat.on{display:block}
#cm{max-height:150px;overflow-y:auto;margin-bottom:8px;font-size:14px;user-select:text}
#cm div{margin-bottom:4px}#cm b{color:var(--amber);font-weight:600}
.row{display:flex;gap:8px}.row .inp{margin:0;flex:1;padding:11px 14px}
.row button{width:46px;border:0;border-radius:14px;background:var(--amber);font-size:18px}
#rolebtn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;display:none;border:0;border-radius:30px;padding:14px 20px;font:600 15px Onest,sans-serif;background:linear-gradient(135deg,#a78bfa,#6d4fe0);color:#fff;box-shadow:0 8px 26px rgba(109,79,224,.5)}
/* OVERLAY / MODAL */
#ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;background:rgba(5,8,20,.82);backdrop-filter:blur(8px);padding:30px}
#ov.show{animation:ovp 2s both}
#ov .e{font-size:88px;animation:pop .8s both}#ov h2{font-size:26px;margin:10px 0 6px}#ov p{opacity:.8}
@keyframes ovp{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1)}}
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(5,8,20,.75);backdrop-filter:blur(6px);padding:24px}
#modal.on{display:flex;animation:in .3s both}
.flip{perspective:900px;width:100%;max-width:320px;height:360px}
.fin{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.rev .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--gb)}
.f1{background:linear-gradient(145deg,#2a1f55,#0e1230)}
.f2{transform:rotateY(180deg);background:linear-gradient(145deg,#1e2250,#0b1020)}
.f2 .e{font-size:64px}.f2 h2{font-size:24px;margin:8px 0}.f2 p{font-size:14px;opacity:.85}
.end{text-align:center}.end .e{font-size:80px;display:block;animation:pop .9s both}.end h2{font-size:24px;margin:6px 0 16px}
#tt{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;background:rgba(255,180,84,.96);color:#1a1204;padding:11px 20px;border-radius:24px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;max-width:90%;text-align:center}
#tt.show{opacity:1;transform:translate(-50%,0)}
.kick{width:26px;height:26px;border-radius:50%;background:rgba(255,77,94,.25);color:#ff8a96;text-align:center;line-height:26px;font-size:13px;flex-shrink:0}
.brow{display:flex;gap:8px;margin-bottom:10px}.brow .btn{margin:0;padding:12px 4px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
<div id="sky" data-p="dusk"><div class="bg b-dusk"></div><div class="bg b-night"></div><div class="bg b-day"></div><div class="bg b-vote"></div><div id="stars"></div><div class="orb"></div><div class="cl" style="top:14%"></div><div class="cl" style="top:26%;animation-delay:-18s;width:90px"></div><svg id="city" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice"></svg></div>

<div id="app">

<section class="scr" id="game">

</section>

</div>
<button id="rolebtn" onclick="openRole()">🎭 Моя роль</button>
<div id="modal" onclick="closeRole()"><div class="flip" id="flip" onclick="event.stopPropagation();this.classList.add('rev')"><div class="fin"><div class="face f1"><div style="font-size:60px">🤫</div><h2 class="d" style="font-size:20px;margin-top:10px">Твоя роль</h2><p style="opacity:.7;margin-top:6px">Торкнись, щоб відкрити.<br>Переконайся, що ніхто не дивиться</p></div><div class="face f2" id="rface"></div></div></div></div>
<div id="ov"></div><div id="tt"></div>

<script>
var $=function(i){return document.getElementById(i)};
var R={mafia:{i:"🔫",n:"Мафія",d:"Щоночі з командою обираєш жертву."},don:{i:"👑",n:"Дон",d:"Лідер мафії. Шериф бачить тебе мирним."},sheriff:{i:"🕵️",n:"Шериф",d:"Щоночі перевіряєш одного гравця."},doctor:{i:"🩺",n:"Доктор",d:"Щоночі рятуєш одного гравця (можна себе)."},citizen:{i:"🙂",n:"Мирний",d:"Вдень шукай мафію і голосуй."},maniac:{i:"🔪",n:"Маніяк",d:"Граєш сам проти всіх. Вбиваєш щоночі."},jester:{i:"🤡",n:"Блазень",d:"Твоя мета — щоб тебе вигнали голосуванням."},guard:{i:"🛡️",n:"Охоронець",d:"Щоночі береш гравця під захист. Якщо його атакують — гинеш замість нього."},courtesan:{i:"💋",n:"Повія",d:"Щоночі відвідуєш гравця — його нічна дія цієї ночі скасовується."},cupid:{i:"💘",n:"Купідон",d:"Першої ночі обираєш двох закоханих. Вони перемагають разом, а коли один гине — гине й другий."}};
var NIGHT={mafia:["Кого прибрати цієї ночі?","Підтвердити"],don:["Кого прибрати цієї ночі?","Підтвердити"],sheriff:["Кого перевірити?","Перевірити"],doctor:["Кого врятувати?","Врятувати"],maniac:["Кого вбити?","Підтвердити"],guard:["Кого охороняти?","Захистити"],courtesan:["До кого прийти цієї ночі?","Відвідати"],cupid:["Обери двох закоханих","Закохати"]};
var MODES=[{k:"classic",i:"🎮",n:"Класика"},{k:"bots",i:"🤖",n:"З ботами"},{k:"speed",i:"⚡",n:"Швидка"}];
var WIN={city:["🎉","Перемога мирних!"],mafia:["😈","Перемога мафії!"],maniac:["🔪","Маніяк переміг!"],jester:["🤡","Блазень переміг!"],lovers:["💕","Закохані перемогли!"]};
var PH={night:["🌙","Настає ніч","Місто засинає. Мафія прокидається…"],day:["☀️","Настає день","Обговоріть, що сталось уночі"],vote:["🗳","Час голосування","Хто залишає місто?"]};
var BN=["Алекс","Богдан","Віка","Діма","Єва","Женя","Зоря","Ігор","Катя","Льоша","Маша","Нікіта","Оля","Паша","Роман","Софія","Тарас","Уляна","Федір","Христя"],BA=["🤖","👾","🦾","🛸","🔮","🎯"],UA=["😎","🧔","👩","🧑","👱","🕵️","🕴️","🦊"];
var db,myId,myName="Гравець",myCode="",isHost=false,gd=null,gref=null,cref=null,mode="classic",lastKey="",lastAdv="",readyKey="",botsKey="",sel=null,sel2=null,fresh=false,off=0,roomsRef=null;

  function fb(){var t=document.createElement("textarea");t.value=c;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(x){toast("Код: "+c)}document.body.removeChild(t)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(ok,fb);else fb()}

(function(){var s="",x=0;while(x<400){var w=18+Math.random()*26|0,h=40+Math.random()*95|0;s+='<rect x="'+x+'" y="'+(160-h)+'" width="'+w+'" height="'+h+'"/>';for(var y=160-h+8;y<150;y+=14)for(var wx=x+5;wx<x+w-6;wx+=9)if(Math.random()<.4)s+='<rect class="w" style="animation-delay:'+(Math.random()*5).toFixed(1)+'s" x="'+wx+'" y="'+y+'" width="3" height="5"/>';x+=w+3}$("city").innerHTML=s;

  var u=null;

function winCheck(P){
  var all=Object.values(P),a=all.filter(function(p){return p.alive}),m=a.filter(isM).length,mn=a.filter(function(p){return p.role==="maniac"}).length,c=a.length-m-mn;

  if(!m&&!mn)return{t:"city",l:all.filter(function(p){return!isM(p)&&p.role!=="maniac"&&p.role!=="jester"})};
  if(m&&m>=c+mn)return{t:"mafia",l:all.filter(isM)};

function resolveNight(){

  Object.keys(acts).forEach(function(u){var p=P[u];if(p&&p.alive&&p.role==="courtesan")bl=acts[u].target});
  Object.keys(acts).forEach(function(u){var a=acts[u],t=a.target,p=P[u];if(!p||!p.alive||!t||u===bl)return;
    if(isM(p))mv[t]=(mv[t]||0)+1;else if(p.role==="maniac")man=t;else if(p.role==="doctor")doc=t;else if(p.role==="sheriff")sh=t;
    else if(p.role==="guard"){gt=t;gu=u}else if(p.role==="cupid"&&gd.round===1&&a.target2&&a.target2!==t&&P[a.target2])cp=[t,a.target2]});

  if(cp){P[cp[0]].love=cp[1];P[cp[1]].love=cp[0]}
  chain(P,dead);

  commit(P,Object.assign({phase:"day",actions:null,votes:null,sheriffRes:res,lastNight:dead.length?"💀 Вночі загинув(ли): <b>"+dead.map(function(u){return esc(P[u].name)}).join(", ")+"</b>":"✨ Цієї ночі всі вижили"},T("day")));
